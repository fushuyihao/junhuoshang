<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>军火商 · 子弹倒卖记账</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">◆</span>
      <div>
        <h1>军火商</h1>
        <p class="sub">子弹倒卖记账 · 回本系数 1.156</p>
      </div>
    </div>
    <div class="top-actions">
      <span id="syncDot" class="sync-dot" title=""></span>
      <button id="btnRefresh" class="btn ghost">刷新</button>
      <button id="btnExport" class="btn ghost">导出</button>
      <button id="btnImport" class="btn ghost">导入</button>
      <input type="file" id="fileImport" accept="application/json" hidden />
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="warehouse">📦 仓库</button>
    <button class="tab" data-tab="price">💰 价格</button>
    <button class="tab" data-tab="sales">📈 销售</button>
  </nav>

  <main>
    <!-- 仓库 -->
    <section id="tab-warehouse" class="panel active">
      <div class="card">
        <h2>录入采购</h2>
        <form id="formPurchase" class="grid-form">
          <label>子弹名称<input name="name" required placeholder="如：5.56mm 常规弹" /></label>
          <label>数量<input name="qty" type="number" min="0" step="any" required placeholder="发" /></label>
          <label>单价(元)<input name="price" type="number" min="0" step="any" required placeholder="每发价格" /></label>
          <label>购买时间(时:分)<input name="time" type="time" /></label>
          <span class="hint">购买日期自动取录入当天，需改年月日请在历史记录中修改</span>
          <button class="btn primary" type="submit">入库</button>
        </form>
      </div>
      <div class="card">
        <div class="table-head">
          <h2>仓库总览</h2>
          <span id="whCount" class="muted"></span>
        </div>
        <div id="warehouseList" class="rows"></div>
      </div>
    </section>

    <!-- 价格 -->
    <section id="tab-price" class="panel">
      <div class="card">
        <h2>记录价格</h2>
        <form id="formPrice" class="grid-form">
          <label>子弹名称<input name="name" required placeholder="如：5.56mm 常规弹" /></label>
          <label>价格(元)<input name="price" type="number" min="0" step="any" required placeholder="当前市价" /></label>
          <span class="hint">记录时间自动取键入当下，可在记录中修改</span>
          <button class="btn primary" type="submit">记录</button>
        </form>
      </div>
      <div class="card">
        <div class="table-head">
          <h2>价格表（最低价）</h2>
          <span id="prCount" class="muted"></span>
        </div>
        <div id="priceList" class="rows"></div>
      </div>
    </section>

    <!-- 销售 -->
    <section id="tab-sales" class="panel">
      <div class="card">
        <h2>录入销售</h2>
        <form id="formSale" class="grid-form">
          <label>子弹名称<input name="name" required placeholder="如：5.56mm 常规弹" /></label>
          <label>数量<input name="qty" type="number" min="0" step="any" required placeholder="发" /></label>
          <label>卖出单价(元)<input name="price" type="number" min="0" step="any" required placeholder="每发售价" /></label>
          <label>卖出时间<input name="time" type="datetime-local" /></label>
          <button class="btn primary" type="submit">售出</button>
        </form>
      </div>
      <div class="card">
        <div class="table-head">
          <h2>销售总览（近7天）</h2>
          <span id="slCount" class="muted"></span>
        </div>
        <div id="salesList" class="rows"></div>
      </div>
    </section>
  </main>

  <!-- 编辑弹窗 -->
  <div id="modal" class="modal-mask" hidden>
    <div class="modal">
      <h3 id="modalTitle">编辑</h3>
      <form id="modalForm"></form>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="modalCancel">取消</button>
        <button type="button" class="btn danger" id="modalDelete">删除</button>
        <button type="button" class="btn primary" id="modalSave">保存</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
